<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UC San Diego Design System — shadcn/ui demo</title>

  <!--
    Built by `npm run demo`.

    dist/shadcn.css is compiled from the same dist/ files a consumer imports, in the
    order docs/using/nextjs.md prescribes:
      @ucsd/tokens/css -> @ucsd/tokens/tailwind -> @ucsd/tokens/shadcn

    dist/app.js is demo/app.tsx bundled with the UNMODIFIED shadcn/ui components in
    demo/components/ui/, vendored from shadcn's own registry by demo/vendor.mjs.

    There are no styles in this file. Everything you see comes from the token
    pipeline and shadcn's own class strings, so anything that looks wrong is a real
    defect rather than a demo that flatters itself.
  -->
  <link rel="stylesheet" href="./dist/shadcn.css">
</head>
<body class="bg-background text-foreground">
  <a href="#main"
     class="sr-only focus:not-sr-only focus:absolute focus:m-small focus:rounded-md focus:bg-primary focus:p-small focus:text-primary-foreground">
    Skip to main content
  </a>

  <div class="mx-auto max-w-base px-large pt-medium text-body-sm">
    <a href="./sidebar.html" class="text-muted-foreground underline underline-offset-4 hover:text-foreground">
      See also: the sidebar-08 block →
    </a>
  </div>

  <div id="root"></div>

  <noscript>
    <p class="mx-auto max-w-base p-large text-body-md">
      This demo renders real React components, so it needs JavaScript. The tokens
      themselves do not — see <code>packages/bootstrap/kitchen-sink.html</code> for a
      no-JavaScript page on the same token layer.
    </p>
  </noscript>

  <script src="./dist/app.js"></script>
</body>
</html>
