name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tokens/figma/ must be EXACTLY the transform of figma-export/ — that is
      # the whole "mirror of the Figma variables" claim. Re-running the sync and
      # diffing proves it, and catches the one drift the other gates cannot see:
      # a hand edit to tokens/figma/, which would pass every check and then be
      # silently reverted by the next real sync.
      - name: tokens/ mirrors the Figma export
        run: |
          npm run sync:figma
          if ! git diff --exit-code --stat -- tokens/figma; then
            echo "::error::tokens/figma/ does not match figma-export/. Never hand-edit tokens/figma/ — change Figma, re-export, and run 'npm run sync:figma'."
            exit 1
          fi

      - name: Build all targets
        run: npm run build

      # Aliasing, mode parity, naming contract, and WCAG AA contrast in both
      # modes. This is what blocks a bad Figma sync from merging.
      - name: Validate tokens
        run: npm run test:tokens

      # The drift gate in the other direction: every published token must be
      # bound into at least one framework surface (Bootstrap variable, Tailwind
      # namespace, shadcn slot) or carry a reasoned entry in
      # tokens/bridge-exceptions.json. This is what catches "the designer added
      # a token in Figma and no bridge picked it up" — it emits a per-token,
      # per-target coverage report as a machine-readable artifact.
      - name: Audit bridge coverage
        run: npm run audit:bridges

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: bridge-coverage
          path: packages/tokens/dist/coverage.json
          retention-days: 30

      - name: Unit and contract tests
        run: npm test

      # The check that keeps the LLM documentation honest. DESIGN.md,
      # references/generated/ and llms.txt are committed so they work with no build
      # step; if a rebuild changes them, someone edited a generated file or forgot to
      # rebuild after a token change — either way the docs no longer match the tokens.
      - name: Generated docs are up to date
        run: |
          if ! git diff --exit-code --stat -- DESIGN.md skills/ llms.txt; then
            echo "::error::Generated files are stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      # Validates DESIGN.md against the format spec: broken token references, WCAG
      # contrast on component pairs, section order. Gated on ERRORS only — the run
      # carries ~35 expected warnings, and they are expected permanently:
      #   ~30  orphaned-tokens    a semantic colour no component happens to reference.
      #                           Normal for a real design system; the alternative is
      #                           deleting useful tokens to quieten a linter.
      #     6  token-like-ignored breakpoints / containers / icons / grid / motion /
      #                           modes. Custom keys are encouraged by the format's
      #                           PHILOSOPHY.md, but this rule still flags them.
      #     1  borderColor        not one of the spec's eight component sub-tokens.
      # A non-zero exit here means a real error, not drift in that count.
      - name: Validate DESIGN.md against the spec
        run: npm run lint:designmd

      # The demos are included deliberately. They are the exemplars an agent is most
      # likely to copy from, one per framework, so they are held to the published
      # rules rather than exempted for being "just a demo".
      - name: Validate own source against the design system rules
        run: |
          node skills/ucsd-design-system/scripts/validate.mjs \
            packages/bootstrap/scss/*.scss \
            packages/bootstrap/kitchen-sink.html \
            demo/shadcn.html demo/sidebar.html \
            demo/app.tsx demo/sidebar.tsx

      - name: Upload built CSS
        uses: actions/upload-artifact@v4
        with:
          name: ucsd-bootstrap-css
          path: packages/bootstrap/dist/
          retention-days: 14
